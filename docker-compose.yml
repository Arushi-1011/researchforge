services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: researchforge
      POSTGRES_PASSWORD: researchforge
      POSTGRES_DB: researchforge
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researchforge -d researchforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    ports: ["8001:8000"]
    volumes: ["./backend:/app", "research_files:/app/storage"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/livez')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports: ["5173:5173"]
    volumes: ["./frontend:/app", "node_modules:/app/node_modules"]
    depends_on:
      api: {condition: service_healthy}

volumes:
  pgdata:
  research_files:
  node_modules:
