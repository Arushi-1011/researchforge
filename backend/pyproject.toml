[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "researchforge-api"
version = "0.1.0"
description = "ResearchForge API"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.12", "uvicorn[standard]==0.34.0", "sqlalchemy[asyncio]==2.0.39",
  "asyncpg==0.30.0", "alembic==1.15.1", "pydantic-settings==2.8.1", "pyjwt==2.10.1",
  "pwdlib[argon2]==0.2.1", "httpx==0.28.1", "pymupdf==1.25.4", "python-multipart==0.0.20",
  "jinja2==3.1.6", "python-docx==1.1.2", "weasyprint==65.0",
  "email-validator==2.2.0",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3"
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pytest-asyncio==0.25.3", "ruff==0.11.0", "mypy==1.15.0", "import-linter==2.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
