[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "researchforge-api"
version = "0.1.0"
description = "ResearchForge API"
requires-python = ">=3.12"
dependencies = [
  # fastapi>=0.128.3 supports starlette>=1.0.0; starlette>=1.3.1 fixes PYSEC-2026-249 etc.
  "fastapi==0.128.3", "uvicorn[standard]==0.34.0", "sqlalchemy[asyncio]==2.0.39",
  "asyncpg==0.30.0", "alembic==1.15.1", "pydantic-settings==2.8.1",
  # pyjwt>=2.15.0 fixes PYSEC-2026-4141, PYSEC-2026-4183 and 20 other CVEs
  "pyjwt==2.15.0",
  "pwdlib[argon2]==0.2.1", "httpx==0.28.1", "pymupdf==1.25.4",
  # python-multipart>=0.0.31 fixes PYSEC-2026-3040 and 7 other CVEs
  "python-multipart==0.0.31",
  "jinja2==3.1.6", "python-docx==1.1.2",
  # weasyprint>=70.0 fixes PYSEC-2026-3940, PYSEC-2026-4311, and 2 others
  "weasyprint==70.0",
  # starlette pinned explicitly so pip-audit checks the resolved transitive dep.
  # Must stay <1.0.0 to satisfy fastapi's dependency range.
  "starlette==0.48.0",
  "email-validator==2.2.0",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3"
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pytest-asyncio==0.25.3", "ruff==0.11.0", "mypy==1.15.0", "import-linter==2.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
ignore_missing_imports = true
# Third-party libraries without bundled stubs
[[tool.mypy.overrides]]
module = [
  "pymupdf",
  "pymupdf.*",
  "fitz",
  "fitz.*",
  "weasyprint",
  "weasyprint.*",
  "docx",
  "docx.*",
  "pwdlib",
  "pwdlib.*",
]
ignore_missing_imports = true
