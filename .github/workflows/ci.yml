name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e './backend[dev]' pip-audit
      # Audit the fully-resolved installed environment (--skip-editable ignores
      # the local researchforge-api package itself, which has no CVEs).
      # Starlette CVEs (PYSEC-2026-161, -248, -249, -1941, -1942, -2280, -2281)
      # cannot be fixed without upgrading past the starlette<1.0.0 bound that
      # fastapi==0.128.3 enforces. They are explicitly acknowledged here.
      - run: >
          pip-audit --skip-editable
          --ignore-vuln PYSEC-2026-161
          --ignore-vuln PYSEC-2026-248
          --ignore-vuln PYSEC-2026-249
          --ignore-vuln PYSEC-2026-1941
          --ignore-vuln PYSEC-2026-1942
          --ignore-vuln PYSEC-2026-2280
          --ignore-vuln PYSEC-2026-2281
      - run: cd backend && ruff check app tests
      - run: cd backend && mypy app
      - run: cd backend && pytest
      - run: cd backend && lint-imports
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: cd frontend && npm ci
      - run: cd frontend && npm run build
      - run: cd frontend && npm test
      - run: cd frontend && npm run lint
